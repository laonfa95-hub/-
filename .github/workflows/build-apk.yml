name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          echo "Using $ZIP_FILE"
          mkdir android-project
          unzip "$ZIP_FILE" -d android-project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build APK
        run: |
          cd android-project
          gradle :app:assembleDebug --stacktrace -Pandroid.useAndroidX=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LooseBox-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
